<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#38261f"><title>Сокровищница Робосычика</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header><div class="eyebrow">СОВИНАЯ АКАДЕМИЯ</div><h1>Сокровищница</h1><p>Коллекция магических артефактов</p></header><nav class="tabs" aria-label="Сокровищницы"><button class="active" data-tab="mine">Моя сокровищница</button><button data-tab="all">Общая сокровищница</button></nav><section class="stats"><div><strong id="counter">0 из 200</strong><span>Уникальных артефактов</span></div><div class="percent" id="percent">0%</div></section><div class="progress"><div id="progress"></div></div><section class="toolbar"><div class="filters" id="filters"><button class="selected" data-rarity="all">Все</button><button data-rarity="обычный" aria-label="Обычные">⚪</button><button data-rarity="необычный" aria-label="Необычные">🟢</button><button data-rarity="редкий" aria-label="Редкие">🔵</button><button data-rarity="эпический" aria-label="Эпические">🟣</button><button data-rarity="легендарный" aria-label="Легендарные">🟡</button></div><button class="refresh" id="refresh" title="Обновить">↻</button></section><div class="notice" id="notice">Демонстрационный режим. Реальные коллекции пока не подключены.</div><section class="shelf" id="shelf" aria-label="Найденные артефакты"></section><p class="empty" id="empty" hidden>В вашей сокровищнице пока нет артефактов. Продолжайте вышивать и не забывайте отчитываться в контрольные точки!</p></main><dialog id="cardDialog"><div class="dialog-body"><button class="close" id="close" aria-label="Закрыть">×</button><div id="bigCard"></div><p id="quantity"></p></div></dialog><script src="app.js" defer></script></body></html>
